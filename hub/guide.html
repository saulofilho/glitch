<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
/* The manual is MANUAL.md itself (tools/gen_hub.py copies it and its screens beside this page), drawn here: the
 * headings get the ids its own links point to (GitHub's way: lower case, spaces to dashes), the screens' paths follow. */
(function () {
  "use strict";
  var doc = document.getElementById("doc");
  function slug(s) { return s.toLowerCase().replace(/[^\w\- ]+/g, "").trim().replace(/ /g, "-"); }
  fetch("FIRST-STEPS.md").then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }).then(function (md) {
    if (!window.marked) throw new Error("no renderer");
    md = md.replace(/\]\(\.\.\/MANUAL\.md/g, "](manual.html")
           .replace(/\]\(\.\.\/README\.md/g, "](https://github.com/saulofilho/glitch/blob/main/README.md");
    doc.innerHTML = marked.parse(md);
    doc.querySelectorAll("h1, h2, h3").forEach(function (h) { h.id = slug(h.textContent); });
    doc.querySelectorAll("img").forEach(function (i) { i.loading = "lazy"; });
    doc.querySelectorAll('a[href$="LICENSING.md"]').forEach(function (a) { a.href = "LICENSING.md"; });
    if (location.hash) { var t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) t.scrollIntoView(); }
  }).catch(function () {
    doc.innerHTML = '<p>The guide did not load here. Read it <a href="FIRST-STEPS.md">as text</a>, or on <a href="https://github.com/saulofilho/glitch/blob/main/docs/FIRST-STEPS.md">GitHub</a>.</p>';
  });
})();
</script>
